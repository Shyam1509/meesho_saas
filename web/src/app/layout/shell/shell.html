<a
  href="#main-content"
  (click)="skipToContent($event)"
  class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-accent-700 focus:shadow"
>
  Skip to main content
</a>

<div class="flex min-h-dvh flex-col">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white">
    <div class="flex h-14 items-center gap-3 px-4 sm:px-6">
      <button
        #menuButton
        type="button"
        class="inline-flex items-center gap-2 rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 md:hidden"
        [attr.aria-controls]="navId"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="size-4">
          @if (menuOpen()) {
            <path
              d="M5.28 4.22a.75.75 0 0 0-1.06 1.06L8.94 10l-4.72 4.72a.75.75 0 1 0 1.06 1.06L10 11.06l4.72 4.72a.75.75 0 1 0 1.06-1.06L11.06 10l4.72-4.72a.75.75 0 0 0-1.06-1.06L10 8.94 5.28 4.22Z"
            />
          } @else {
            <path
              d="M2 4.75A.75.75 0 0 1 2.75 4h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 4.75Zm0 5.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 10Zm.75 4.5a.75.75 0 0 0 0 1.5h14.5a.75.75 0 0 0 0-1.5H2.75Z"
            />
          }
        </svg>
        Menu
      </button>

      <a routerLink="/overview" class="rounded-sm text-base font-semibold text-slate-900">
        {{ productName }}
      </a>
    </div>
  </header>

  <div class="flex flex-1">
    <nav
      [id]="navId"
      aria-label="Main"
      class="fixed inset-x-0 top-14 bottom-0 z-20 overflow-y-auto border-slate-200 bg-white md:static md:block md:w-60 md:shrink-0 md:border-r"
      [class.hidden]="!menuOpen()"
    >
      <ul class="space-y-1 p-3">
        @for (item of navItems; track item.link) {
          <li>
            <a
              [routerLink]="item.link"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              class="block rounded-md px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 hover:text-slate-900 aria-[current=page]:bg-accent-50 aria-[current=page]:font-semibold aria-[current=page]:text-accent-800"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <main
      #main
      id="main-content"
      tabindex="-1"
      class="min-w-0 flex-1 px-4 py-6 focus-visible:outline-none sm:px-6 lg:px-8"
    >
      <router-outlet />
    </main>
  </div>
</div>
